a{color:var(--accent)}

<script>
/* ============ 工具 ============ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayKey = (d=new Date()) => { const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; };
const fmtTime = s => { s=Math.max(0,Math.round(s||0)); const m=Math.floor(s/60), r=s%60; return `${m}:${String(r).padStart(2,'0')}`; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const daysBetween=(a,b)=>Math.floor((b-a)/86400000);
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
function tokenize(text){
  return String(text||'').toLowerCase().replace(/[‘’ʼ]/g,"'").replace(/[“”]/g,'"')
    .replace(/[^a-z0-9'À-ɏ\s-]/g,' ').split(/\s+/).map(w=>w.replace(/^['-]+|['-]+$/g,'')).filter(Boolean);
}
function wordCount(t){ return tokenize(t).length; }
/* 最长公共子序列对齐：返回 {matched, align:[{type:'ok'|'miss'|'extra', a?, b?}]} ；a=原文词，b=听写词 */
function alignWords(a,b){
  const n=a.length,m=b.length;
  if(n*m>16_000_000){ // 太长就退化为词袋
    const bag=new Map(); for(const w of b) bag.set(w,(bag.get(w)||0)+1);
    let matched=0; const align=a.map(w=>{ if(bag.get(w)>0){bag.set(w,bag.get(w)-1);matched++;return {type:'ok',a:w};} return {type:'miss',a:w}; });
    return {matched,align};
  }
  const W=m+1; const dp=new Uint16Array((n+1)*(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--){ dp[i*W+j]= a[i]===b[j] ? dp[(i+1)*W+j+1]+1 : Math.max(dp[(i+1)*W+j],dp[i*W+j+1]); }
  const align=[]; let i=0,j=0;
  while(i<n&&j<m){ if(a[i]===b[j]){align.push({type:'ok',a:a[i],b:b[j]});i++;j++;} else if(dp[(i+1)*W+j]>=dp[i*W+j+1]){align.push({type:'miss',a:a[i]});i++;} else {align.push({type:'extra',b:b[j]});j++;} }
  while(i<n){align.push({type:'miss',a:a[i++]});} while(j<m){align.push({type:'extra',b:b[j++]});}
  return {matched:dp[0],align};
}
function splitParagraphs(text){ return String(text||'').replace(/\r/g,'').split(/\n\s*\n|\n/).map(s=>s.trim()).filter(Boolean); }
function splitSentences(p){
  const parts=p.split(/(?<=[.!?…]["'”’)\]]?)\s+(?=["'“‘(\[]?[A-Z0-9])/).map(s=>s.trim()).filter(Boolean);
  return parts.length?parts:[p];
}
/* 把原文拆成 意群(段) → 句 */
function buildStructure(transcript){
  let paras=splitParagraphs(transcript);
  const sents=[]; const groups=[];
  paras.forEach(p=>{ const ss=splitSentences(p); groups.push(ss.length); ss.forEach(s=>sents.push(s)); });
  // 没分段的长文：每 4 句算一个意群
  let paraOf=[]; if(paras.length<=1 && sents.length>6){ paraOf=sents.map((_,i)=>Math.floor(i/4)); }
  else { let k=0; groups.forEach((g,pi)=>{ for(let x=0;x<g;x++) paraOf[k++]=pi; }); }
  return {sents, paraOf, paraCount: paraOf.length? Math.max(...paraOf)+1 : 0};
}
/* 听写漏掉的词自动进生词本时，剔除这些虚词 */
const STOP=new Set('the and for are but not you all any can had her was one our out day get has him his how man new now old see two way who boy did its let put say she too use that with have this will your from they know want been good much some time very when come here just like long make many more only over such take than them well were what about after again also back because before being between both could does each even every first found give going great here into just last little most never next other people same should still their there these they thing think those though three through under upon used using where which while whole with without would year your'.split(/\s+/));
/* TED 精选库：17–21 分钟档，按话题挑。时长是约数，以 TED 页面为准 */
const TED_LIB=[
 {t:'AI',s:'fei_fei_li_how_we_re_teaching_computers_to_understand_pictures',n:'How we\'re teaching computers to understand pictures',p:'Fei-Fei Li',m:18,d:'李飞飞讲 ImageNet：怎么教机器"看懂"图片，AI 入门必听'},
 {t:'AI',s:'jeremy_howard_the_wonderful_and_terrifying_implications_of_computers_that_can_learn',n:'The wonderful and terrifying implications of computers that can learn',p:'Jeremy Howard',m:20,d:'深度学习能做什么、会冲击什么，讲得很平实'},
 {t:'心理',s:'dan_gilbert_the_surprising_science_of_happiness',n:'The surprising science of happiness',p:'Dan Gilbert',m:21,d:'人为什么会"合成"幸福感，语速快、信息密'},
 {t:'心理',s:'daniel_kahneman_the_riddle_of_experience_vs_memory',n:'The riddle of experience vs. memory',p:'Daniel Kahneman',m:20,d:'诺奖得主讲体验自我和记忆自我，句子长、逻辑严'},

/* TED：从链接取 slug；清洗逐字稿里的时间戳、舞台提示、说话人名 */
function tedSlug(url){ const m=String(url||'').match(/ted\.com\/talks\/([a-z0-9_]+)/i); return m?m[1]:''; }
function tedTitle(slug){ const parts=slug.split('_').filter(Boolean); if(parts.length>4) parts.splice(0,2); return parts.map(w=>w[0].toUpperCase()+w.slice(1)).join(' '); }
function cleanTranscript(text){
  let t=String(text||'').replace(/\r/g,''); const before=t;
  t=t.replace(/^\s*\d{1,2}:\d{2}(?::\d{2})?\s*$/gm,'');                 // 单独成行的时间戳
  t=t.replace(/^\s*\d{1,2}:\d{2}(?::\d{2})?\s+/gm,'');                  // 行首时间戳
  t=t.replace(/\[\d{1,2}:\d{2}(?::\d{2})?\]/g,'');
  t=t.replace(/\((?:Laughter|Laughs|Applause|Cheers|Cheering|Music|Singing|Video|Audio|Sighs|Gasps|Whistles|Recording|Beat|Pause|Silence|Mock sobs?|Inaudible|Crosstalk|Chuckles|Coughs)[^)]*\)/gi,'');
  t=t.replace(/\[(?:Laughter|Applause|Music|inaudible|crosstalk)[^\]]*\]/gi,'');
  t=t.replace(/^(?:[A-Z][A-Za-z.'\-]+(?: [A-Z][A-Za-z.'\-]+){0,3}|[A-Z]{1,3}):\s+/gm,''); // 段首人名：
  t=t.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').replace(/[ \t]{2,}/g,' ').trim();
  return {text:t, removed: wordCount(before)-wordCount(t)};
}
function firstLetters(s){ return s.replace(/[A-Za-zÀ-ɏ']+/g, w=>w[0]+'_'.repeat(Math.max(1,Math.min(w.length-1,6)))); }

/* ============ 存储：云端 db（按人私有）+ 本地镜像；音频存设备 IndexedDB ============ */
const Store = {
  db:null, uid:null, ready:false, pending:new Map(), timers:new Map(),
  lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch{ return null; } },
  lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  lsDel(k){ try{ localStorage.removeItem(k); }catch{} },
  async init(){
    try{
      if(!window.claude?.use) return;
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      if(db&&user){ const id=await user.id(); if(id){ this.db=db; this.uid=id; } }
    }catch(e){ console.warn('db unavailable',e); }
  },
  base(){ return `data/users/${this.uid}`; },
  async pullAll(){ // 返回 {profile, materials} 或 null
    if(!this.db) return null;
    try{
      const [p,q,e]=await Promise.all([ this.db.doc(`${this.base()}/profile`).get(), this.db.collection(`${this.base()}/materials/items`).get(), this.db.doc(`${this.base()}/errors`).get() ]);
      const materials={}; q.docs.forEach(d=>{ const x=d.data(); if(x) materials[d.id]=x; });
      return {profile: p.exists? p.data(): null, materials, errors: e.exists? e.data(): null};
    }catch(e){ console.warn('pull failed',e); return null; }
  },
  saveMaterial(m, immediate=false){
    m.updatedAt=Date.now(); this.lsSet('kl:m:'+m.id, m); markToday();
    if(!this.db) return;
    const run=()=>{ this.timers.delete(m.id); this.db.doc(`${this.base()}/materials/items/${m.id}`).set(JSON.parse(JSON.stringify(m))).catch(e=>console.warn('save failed',e)); };
    clearTimeout(this.timers.get(m.id)); if(immediate) run(); else this.timers.set(m.id, setTimeout(run, 1200));
  },
  saveProfile(p){ p.updatedAt=Date.now(); this.lsSet('kl:profile', p); if(this.db) this.db.doc(`${this.base()}/profile`).set(JSON.parse(JSON.stringify(p))).catch(e=>console.warn(e)); },
  saveErrors(e){ e.updatedAt=Date.now(); this.lsSet('kl:errors', e); markToday(); if(!this.db) return; clearTimeout(this.timers.get('errors')); this.timers.set('errors', setTimeout(()=>{ this.db.doc(`${this.base()}/errors`).set(JSON.parse(JSON.stringify(e))).catch(err=>console.warn(err)); },800)); },
  async deleteMaterial(id){ this.lsDel('kl:m:'+id); if(this.db){ try{ await this.db.doc(`${this.base()}/materials/items/${id}`).delete(); }catch(e){console.warn(e);} } },
  localAll(){ const materials={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith('kl:m:')){ const v=this.lsGet(k); if(v&&v.id) materials[v.id]=v; } } }catch{} return {profile:this.lsGet('kl:profile'), materials}; }
};
const AudioStore = {
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('kenliao',1); r.onupgradeneeded=()=>r.result.createObjectStore('audio'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async put(id,blob){ const d=await this.open(); return new Promise((res,rej)=>{ const t=d.transaction('audio','readwrite'); t.objectStore('audio').put(blob,id); t.oncomplete=res; t.onerror=()=>rej(t.error); }); },
  async get(id){ try{ const d=await this.open(); return await new Promise((res,rej)=>{ const r=d.transaction('audio').objectStore('audio').get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }catch{ return null; } },
  async del(id){ try{ const d=await this.open(); d.transaction('audio','readwrite').objectStore('audio').delete(id); }catch{} }
};

/* ============ 错题本：核对时漏掉/写错的词自动登记并计次；填空反复练，连对三次过关 ============ */
const GRADUATE=3;
function sentenceFor(m, word){ const st=buildStructure(m.transcript); const i=st.sents.findIndex(s=>tokenize(s).includes(word)); return i>=0?{i,text:st.sents[i]}:null; }
function logErrorWord(m, word){
  const E=S.errors.items; const k='w:'+word; const it=E[k]||(E[k]={type:'word',word,count:0,right:0,streak:0,lastWrong:0,lastAt:0,ctx:[]});
  it.count++; it.streak=0; it.lastWrong=Date.now(); it.lastAt=it.lastWrong;
  const c=sentenceFor(m,word); if(c&&!it.ctx.some(x=>x.mid===m.id&&x.i===c.i)){ it.ctx.push({mid:m.id,i:c.i,text:c.text}); if(it.ctx.length>5) it.ctx=it.ctx.slice(-5); }
}
function logErrorSentence(m, i, text){
  const E=S.errors.items; const k='s:'+m.id+':'+i; const it=E[k]||(E[k]={type:'sent',mid:m.id,i,text,count:0,right:0,streak:0,lastWrong:0,lastAt:0});
  it.count++; it.streak=0; it.lastWrong=Date.now(); it.lastAt=it.lastWrong; return it;
}
function errorItems(){ return Object.entries(S.errors.items).map(([k,v])=>Object.assign({key:k},v)); }
function pendingErrors(){ return errorItems().filter(x=>x.streak<GRADUATE).sort((a,b)=>(a.streak-b.streak)||(b.count-a.count)||(a.lastAt-b.lastAt)); }
function startDrill(){ const q=pendingErrors().slice(0,10).map(x=>x.key); if(!q.length) return toast('错题本是空的，先去听写'); S.drill={queue:q, idx:0, revealed:false, right:0, wrong:0, answer:''}; S.view='drill'; P.el.pause(); render(); window.scrollTo(0,0); }
function clozeHTML(text, word){ return text.split(/(\s+)/).map(w=>{ if(/^\s+$/.test(w)) return w; const k=tokenize(w)[0]; if(k===word){ return `<span class="blank">${esc(w.replace(/[A-Za-zÀ-ɏ']+/, s=>s[0]+'_'.repeat(Math.max(2,s.length-1))))}</span>`; } return esc(w); }).join(''); }
function renderDrill(){
  const d=S.drill; if(!d){ S.view='home'; return render(); }
  $('#title').textContent='错题本 · 练一组'; $('#subTitle').textContent=`${Math.min(d.idx+1,d.queue.length)} / ${d.queue.length}`;
  if(d.idx>=d.queue.length){
    const left=pendingErrors().length;
    $('#drillView').innerHTML=`<div class="card"><div class="eyebrow">这组练完</div><h2>对 ${d.right} · 错 ${d.wrong}</h2><p class="small muted" style="margin:6px 0 12px">${left?`还有 ${left} 条没过关。连对三次才算过，错一次从头计。`:'错题本清空了，漂亮。'}</p><div class="row">${left?'<button class="btn primary" id="drillAgain">再来一组</button>':''}<button class="btn" id="drillHome">回首页</button></div></div>`;
    $('#drillHome').onclick=()=>{ S.drill=null; S.view='home'; render(); }; const ag=$('#drillAgain'); if(ag) ag.onclick=startDrill; return;
  }
  const it=S.errors.items[d.queue[d.idx]]; if(!it){ d.idx++; return render(); }
  const mTitle = it.type==='word' ? (it.ctx[0]&&S.materials[it.ctx[0].mid]?S.materials[it.ctx[0].mid].title:'') : (S.materials[it.mid]?S.materials[it.mid].title:'');
  let body='';
  if(it.type==='word'){
    const ctx=it.ctx.length? it.ctx[(it.count+d.idx)%it.ctx.length] : null;
    body=`<div class="eyebrow">填空 · 错过 ${it.count} 次 · 连对 ${it.streak}/${GRADUATE}</div>
      <div class="drill-q">${ctx?clozeHTML(ctx.text,it.word):`<span class="blank">${esc(it.word[0]+'_'.repeat(it.word.length-1))}</span>`}</div>
      ${mTitle?`<div class="hint">出自《${esc(mTitle)}》</div>`:''}
      ${d.revealed?`<div class="note ${d.lastRight?'ok':'bad'}" style="margin-top:10px">${d.lastRight?'对了':'写错了'}：正确是 <b class="num" style="font-family:var(--serif);font-size:17px">${esc(it.word)}</b>${d.answer&&!d.lastRight?`，你写的是「${esc(d.answer)}」`:''}</div>`:''}
      <div class="row" style="margin-top:12px"><input type="text" id="drillIn" class="grow" placeholder="把这个词写出来" autocapitalize="off" autocorrect="off" spellcheck="false" ${d.revealed?'disabled':''} value="${d.revealed?esc(d.answer):''}">${d.revealed?`<button class="btn primary" id="drillNext">下一题</button>`:`<button class="btn primary" id="drillCheck">检查</button>`}</div>`;
  } else {
    body=`<div class="eyebrow">整句默写 · 记了 ${it.count} 次 · 连对 ${it.streak}/${GRADUATE}</div>
      <div class="drill-q muted">${esc(firstLetters(it.text))}</div>
      ${mTitle?`<div class="hint">出自《${esc(mTitle)}》，只给首字母，把整句写出来</div>`:''}
      ${d.revealed?`<div class="diff card" style="box-shadow:none;margin-top:10px">${d.diffHtml}</div><div class="note ${d.lastRight?'ok':'bad'}" style="margin-top:8px">${d.lastRight?'对了，九成以上':'还不到九成，看看红的地方'}</div>`:''}
      <textarea id="drillIn" class="paper" style="min-height:120px;margin-top:12px" placeholder="写整句" spellcheck="false" ${d.revealed?'disabled':''}>${d.revealed?esc(d.answer):''}</textarea>
      <div class="row" style="margin-top:10px">${d.revealed?`<button class="btn primary grow" id="drillNext">下一题</button>`:`<button class="btn primary grow" id="drillCheck">检查</button>`}</div>`;
  }
  $('#drillView').innerHTML=`<div class="card">${body}</div><div class="row" style="justify-content:space-between"><button class="btn sm ghost" id="drillSkip" ${d.revealed?'disabled':''}>跳过这题</button><button class="btn sm ghost danger" id="drillDrop">这条不用再练</button></div>`;
  const inp=$('#drillIn'); if(!d.revealed) inp.focus();
  const check=()=>{ const ans=inp.value.trim(); if(!ans) return toast('先写点什么'); let right=false;
    if(it.type==='word'){ right = tokenize(ans)[0]===it.word; }
    else { const r=alignWords(tokenize(it.text),tokenize(ans)); right = r.matched/Math.max(1,tokenize(it.text).length)>=0.9; d.diffHtml=r.align.map(x=>x.type==='ok'?`<span class="ok">${esc(x.a)}</span>`:x.type==='miss'?`<span class="miss">${esc(x.a)}</span>`:`<span class="extra">${esc(x.b)}</span>`).join(' '); }
    if(right){ it.streak++; it.right++; d.right++; } else { it.streak=0; it.count++; it.lastWrong=Date.now(); d.wrong++; }
    it.lastAt=Date.now(); d.revealed=true; d.lastRight=right; d.answer=ans; Store.saveErrors(S.errors); render(); };
  const ck=$('#drillCheck'); if(ck){ ck.onclick=check; inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&it.type==='word'){ e.preventDefault(); check(); } }); }
  const nx=$('#drillNext'); if(nx) nx.onclick=()=>{ d.idx++; d.revealed=false; d.answer=''; render(); };
  $('#drillSkip').onclick=()=>{ d.idx++; render(); };
  $('#drillDrop').onclick=()=>{ delete S.errors.items[it.key]; Store.saveErrors(S.errors); d.idx++; d.revealed=false; toast('已移出错题本'); render(); };
}

/* ============ 播放器 ============ */
const P = { el:$('#player'), matId:null, url:null, A:null, B:null, loop:false, rate:1, onEnded:null, blobMissing:false };
async function loadAudio(m){
  if(P.matId===m.id && P.url) return true;
  const blob=await AudioStore.get(m.id);
  if(P.url){ URL.revokeObjectURL(P.url); P.url=null; }
  P.matId=m.id; P.A=P.B=null; P.loop=false;
  if(!blob){ P.blobMissing=true; P.el.removeAttribute('src'); return false; }
  P.blobMissing=false; P.url=URL.createObjectURL(blob); P.el.src=P.url; P.el.playbackRate=P.rate; return true;
}
P.el.addEventListener('timeupdate',()=>{ if(P.loop&&P.A!=null&&P.B!=null&&P.el.currentTime>=P.B){ P.el.currentTime=P.A; } updatePlayerUI(); });
P.el.addEventListener('ended',()=>{ updatePlayerUI(); if(P.onEnded) P.onEnded(); });
P.el.addEventListener('play',updatePlayerUI); P.el.addEventListener('pause',updatePlayerUI); P.el.addEventListener('loadedmetadata',updatePlayerUI);
function playerHTML(opts={}){
  const seg=opts.segment? `<div class="seg"><button class="btn sm" data-p="A">A</button><button class="btn sm" data-p="B">B</button><button class="btn sm" data-p="loop">循环</button></div>`:'';
  const back=opts.back!==false? `<button class="btn sm" data-p="-3">‹3s</button><button class="btn sm" data-p="-5">‹5s</button>`:'';
  const speed=opts.speed? `<select class="btn sm" data-p="rate" aria-label="语速"><option value="0.75">0.75×</option><option value="0.85">0.85×</option><option value="1" selected>1.0×</option></select>`:'';
  return `<div class="player" id="playerBox">
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="进度">
    <div class="time"><span id="tCur" class="num">0:00</span><span id="tDur" class="num">0:00</span></div>
    <div class="ctl"><button class="play" data-p="toggle" aria-label="播放/暂停">▶</button>${back}${speed}${seg}</div>
    <div class="hint" id="pHint" hidden></div>
  </div>`;
}
function bindPlayer(root){
  const box=$('#playerBox',root); if(!box) return;
  if(P.blobMissing){ const h=$('#pHint',box); h.hidden=false; h.innerHTML='这台设备上没有这篇的音频文件。音频只存在选材时用的那台设备里，换了设备要重新选一次同一个文件。 <label class="btn sm" style="display:inline-block">重新选择音频<input type="file" accept="audio/*" id="reAudio" hidden></label>'; $('#reAudio',box).onchange=async e=>{ const f=e.target.files[0]; if(!f) return; await AudioStore.put(P.matId,f); P.url=null; await loadAudio(S.materials[P.matId]); toast('音频已接回'); render(); }; }
  box.addEventListener('click',e=>{
    const b=e.target.closest('[data-p]'); if(!b||b.tagName==='SELECT') return; const k=b.dataset.p; const el=P.el;
    if(k==='toggle'){ if(el.paused) el.play().catch(()=>toast('这台设备暂时放不了这个文件')); else el.pause(); }
    else if(k==='-3'){ el.currentTime=Math.max(0,el.currentTime-3); }
    else if(k==='-5'){ el.currentTime=Math.max(0,el.currentTime-5); }
    else if(k==='A'){ P.A=el.currentTime; if(P.B!=null&&P.B<=P.A) P.B=null; toast('A 点 '+fmtTime(P.A)); }
    else if(k==='B'){ if(P.A==null){toast('先点 A');return;} P.B=el.currentTime; if(P.B<=P.A){toast('B 要在 A 后面');return;} P.loop=true; el.currentTime=P.A; el.play().catch(()=>{}); toast(`循环 ${fmtTime(P.A)}–${fmtTime(P.B)}`); }
    else if(k==='loop'){ if(P.A==null||P.B==null){toast('先设 A、B 两点');return;} P.loop=!P.loop; toast(P.loop?'循环开':'循环关'); }
    updatePlayerUI();
  });

function updatePlayerUI(){

function openMaterial(id){ S.view='mat'; S.curId=id; S.sub[id]=S.sub[id]||{}; P.el.pause(); render(); window.scrollTo(0,0); }

/* ============ 渲染：素材四步 ============ */
function renderMaterial(){
  const m=S.materials[S.curId]; if(!m){ S.view='home'; return render(); }
  const idx=orderedMaterials().indexOf(m)+1; const day=m.startedAt? daysBetween(m.startedAt,Date.now())+1:0;
  $('#title').textContent=m.title||`第 ${idx} 篇`; $('#subTitle').textContent= m.status==='done'?'已完成':(day?`第 ${idx} 篇 · 第 ${day} 天`:`第 ${idx} 篇`);
  const sub=S.sub[m.id]; const showStep = sub.step && sub.step<=m.step ? sub.step : m.step;
  const rail=`<div class="steps" id="rail">${STEPS.map((n,i)=>{ const s=i+1; const cls= m.status==='done'||s<m.step?'done': s===m.step?'cur':'lock'; return `<button class="step ${cls} ${s===showStep?'on':''}" data-s="${s}" style="${s===showStep?'box-shadow:0 0 0 2px var(--accent)':''}"><span class="k">0${s}${cls==='lock'?' 🔒':cls==='done'?' ✓':''}</span><span class="nm">${n}</span></button>`; }).join('')}</div>`;
  let body='';
  if(showStep===1) body=stepSelect(m); else if(showStep===2) body=stepDictation(m); else if(showStep===3) body=stepDigest(m); else body=stepSpeed(m);
  $('#matView').innerHTML=rail+body;
  $('#rail').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ const s=+b.dataset.s; if(s>m.step && m.status!=='done'){ toast(lockReason(m,s)); return; } S.sub[m.id].step=s; render(); });
  bindStep(m, showStep);
}
function lockReason(m,s){ return ['', '', '第一步选好材、锁好原文，才开听写。', '听写核对到七成以上，才看原文、开始吃透。', '每句吃透、每段能脱稿，才练原速。'][s]; }

/* ---------- 第一步：选材 ---------- */
function stepSelect(m){
  const locked = m.step>1;
  const dur=m.durationSec; let durMsg='', durCls='';

  const wc=wordCount(m.transcript);
  if(locked){
    return `<div class="card"><div class="eyebrow">01 选材 · 已锁定</div><h2>${esc(m.title)}</h2>
      <dl class="kv" style="margin-top:8px"><dt>类型</dt><dd>${esc(TYPES[m.type]||m.type)}</dd><dt>音频</dt><dd>${esc(m.audioName)} · ${fmtTime(m.durationSec)}</dd><dt>原文</dt><dd>${wc} 词 · ${m.step>=3?'已核对，可查看':'锁定中，核对前不显示'}</dd>${m.source?`<dt>来源</dt><dd>${esc(m.source)}</dd>`:''}<dt>开始</dt><dd>${new Date(m.startedAt).toLocaleDateString('zh-CN')}</dd></dl>

  }
  return `<div class="card"><div class="eyebrow">01 选材</div><h2>找一篇你真想听懂的</h2>
    <p class="small muted" style="margin:6px 0 14px">她的标准：感兴趣、20 分钟左右、之前没接触过。新闻、访谈、演讲、纪录片、书都行；文学、诗歌、影视对白不行。原文现在就要粘进来，保存后会锁起来，听写核对前你看不到它。</p>
    <div class="stack" style="margin-top:0">

        <div class="stack" style="margin-top:10px;gap:10px">
          <div class="small" style="color:var(--soft-ink)">精选 ${TED_LIB.length} 篇 17–21 分钟的演讲，按话题挑一篇；也可以在最下面粘任何 TED 链接。</div>
          <div class="row" id="tedTopics" style="gap:6px">${['全部'].concat(TED_TOPICS).map((t,i)=>`<button type="button" class="btn sm ${i===0?'on':''}" data-topic="${t}">${t}</button>`).join('')}</div>
          <div class="tedlist" id="tedList"></div>
          <input type="text" id="tedUrl" value="${esc(tedSlug(m.source)?m.source:'')}" placeholder="或者粘任何 TED 演讲链接 https://www.ted.com/talks/…" inputmode="url">
          <div id="tedOut" class="small muted">挑 18 分钟档的演讲，讲话量大约两千五到三千词。</div>
        </div></details>
      <label class="f"><span><b>标题</b></span><input type="text" id="fTitle" value="${esc(m.title)}" placeholder="例：TED · Why we sleep"></label>

      <label class="f"><span><b>来源</b>（可选，网址或节目名）</span><input type="text" id="fSource" value="${esc(m.source)}" placeholder="方便以后找回去"></label>

        <div class="row"><label class="btn sm" style="display:inline-block">${m.audioName?'换一个文件':'选择音频'}<input type="file" accept="audio/*" id="fAudio" hidden></label><span class="small muted grow">${esc(m.audioName||'还没选')}</span></div>
        ${durMsg?`<div class="note ${durCls}">${durMsg}</div>`:''}</div>
      <label class="f"><span class="row" style="justify-content:space-between"><span><b>原文</b>（逐字稿）<span id="wcHint">${wc?` · 已 ${wc} 词 · 约 ${Math.round(wc/150)} 分钟讲话量`:''}</span></span><button type="button" class="btn sm" id="cleanBtn">清理格式</button></span><textarea id="fText" placeholder="粘贴整篇原文。时间戳、(Laughter)、说话人名字不用手删，点「清理格式」。">${esc(m.transcript)}</textarea></label>

    </div></div>`;
}
function bindSelect(m){
  const ask=$('#delAsk'); if(ask){ ask.onclick=()=>{$('#delConfirm').hidden=false;}; $('#delNo').onclick=()=>{$('#delConfirm').hidden=true;}; $('#delGo').onclick=async()=>{ delete S.materials[m.id]; await Store.deleteMaterial(m.id); AudioStore.del(m.id); S.view='home'; toast('已删除'); render(); }; }

    const base=`https://www.ted.com/talks/${slug}`; const title=tedTitle(slug);
    tedOut.className='small'; tedOut.innerHTML=`<div class="stack" style="gap:8px;margin-top:0">
      <div class="row"><span class="chip">${esc(title)}</span><button type="button" class="btn sm" id="tedFill">填入标题、类型、来源</button></div>
      <div><b>① 逐字稿</b>：<a href="${base}/transcript?language=en" target="_blank" rel="noopener">打开英文逐字稿页</a>，全选复制，粘到下面「原文」里，点「清理格式」。</div>
      <div><b>② 音频</b>：打开 <a href="${base}" target="_blank" rel="noopener">演讲页</a>，点「Share / 分享」里的「Download / 下载」，选 Audio（mp3）。手机 Safari 会把它存进「文件」App 的「下载」文件夹，回到这里点「选择音频」从「文件」里选它。用电脑下再传到手机也行。TED 应用内的下载不是文件，用不了。</div>

    $('#tedFill').onclick=()=>{ if(!$('#fTitle').value.trim()) $('#fTitle').value='TED · '+title; $('#fType').value='speech'; $('#fSource').value=base; save(); toast('已填好标题、类型、来源'); }; };
  tedUrl.addEventListener('input',renderTed); tedUrl.addEventListener('change',()=>{ const slug=tedSlug(tedUrl.value); if(slug&&!$('#fSource').value.trim()){ $('#fSource').value=`https://www.ted.com/talks/${slug}`; save(); } }); renderTed();
  // 精选库

  $('#tedTopics').querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{ topic=b.dataset.topic; $('#tedTopics').querySelectorAll('[data-topic]').forEach(c=>c.classList.toggle('on',c===b)); renderList(); });
  renderList();
  $('#fAudio').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; save();
    toast('正在读音频时长…'); const url=URL.createObjectURL(f); const a=new Audio(); a.preload='metadata';

}

/* ---------- 第二步：听写 ---------- */
function stepDictation(m){
  const sub=S.sub[m.id]; const phase = m.step>2 ? (sub.phase||'check') : (sub.phase|| (m.blind.passes>=2 ? (sub.phase||'blind') : 'blind'));

  const tabs=`<div class="subtabs"><button data-ph="blind" class="${phase==='blind'?'on':''}">盲听</button><button data-ph="write" class="${phase==='write'?'on':''}" ${canWrite?'':'disabled'}>逐句听写</button><button data-ph="check" class="${phase==='check'?'on':''}" ${canCheck||m.step>2?'':'disabled'}>核对</button></div>`;

      <div class="note" style="margin-top:12px"><span class="chip lock">🔒 原文已锁定</span>&nbsp; 核对前看不到原文，这是方法的核心，不是软件的限制。</div>`;
  } else if(phase==='write'){

      <p class="small muted" style="margin:6px 0 12px">A、B 两点圈住一句反复放，退 3 秒 5 秒都在。先不管对错，听到什么写什么。实在听不出再查词典、联系上下文猜，写到大约七成再去核对。</p>
      ${playerHTML({segment:true,speed:true})}

      <button class="btn primary block" id="toCheck" style="margin-top:14px" ${canCheck?'':'disabled'}>${canCheck?'我写到七成了，去核对':`写到原文六成以上才能核对（现在 ${(ratio*100).toFixed(0)}%）`}</button>`;

        <p class="small muted" style="margin:6px 0 12px">她的标准是七成左右，到了才看原文。下面只标出你写的里哪些词原文里没有，不显示原文。回去再听，该查词典查词典，联系上下文把空补上。</p>

function checkResult(m){

  const mineHtml=align.filter(x=>x.type!=='miss').map(x=> x.type==='ok'?`<span class="ok">${esc(x.b)}</span>`:`<span class="extra">${esc(x.b)}</span>`).join(' ');
  return {acc,matched,n:a.length,missed:missed.filter(w=>{ if(seen.has(w)) return false; seen.add(w); return true; }),html,mineHtml};
}

}

/* ---------- 第三步：吃透 · 背诵 ---------- */
function stepDigest(m){
  const sub=S.sub[m.id]; const st=buildStructure(m.transcript); const total=st.sents.length; const okN=st.sents.filter((_,i)=>m.understood[i]).length; const allOk=okN===total&&total>0;
  const phase= sub.phase==='recite' ? (allOk||m.step>3?'recite':'digest') : 'digest';
  const tabs=`<div class="subtabs"><button data-ph="digest" class="${phase==='digest'?'on':''}">吃透 <span class="num">${okN}/${total}</span></button><button data-ph="recite" class="${phase==='recite'?'on':''}" ${allOk||m.step>3?'':'disabled'}>背到脱稿</button></div>`;
  let body='';
  if(phase==='digest'){
    let lastP=-1; const items=st.sents.map((s,i)=>{ const ph= st.paraOf[i]!==lastP ? (lastP=st.paraOf[i], `<div class="para-h">意群 ${st.paraOf[i]+1}</div>`) : '';
      const vs=new Set(m.vocab.map(v=>v.word)); const words=s.split(/(\s+)/).map(w=>{ if(/^\s+$/.test(w)) return w; const key=tokenize(w)[0]; return key?`<span class="w ${vs.has(key)?'v':''}" data-w="${esc(key)}" data-i="${i}">${esc(w)}</span>`:esc(w); }).join('');
      return `${ph}<div class="sent ${m.understood[i]?'ok':''}" data-i="${i}"><div class="en">${words}</div><textarea data-note="${i}" placeholder="句型 / 语法 / 为什么这么说">${esc(m.notes[i]||'')}</textarea><div class="row" style="justify-content:space-between"><label class="row small"><input type="checkbox" data-ok="${i}" ${m.understood[i]?'checked':''}> 这句吃透了</label><button class="btn sm ghost ${S.errors.items['s:'+m.id+':'+i]?'on':''}" data-err="${i}">${S.errors.items['s:'+m.id+':'+i]?'已在错题本':'记为错题'}</button></div></div>`; }).join('');
    const vocab=m.vocab.length? m.vocab.map((v,k)=>`<div class="vi"><b>${esc(v.word)}</b><input type="text" data-vm="${k}" value="${esc(v.meaning)}" placeholder="释义 / 用法"><span class="row" style="gap:4px"><a class="btn sm" href="https://dict.youdao.com/result?word=${encodeURIComponent(v.word)}&lang=en" target="_blank" rel="noopener">查</a><button class="btn sm ghost" data-vdel="${k}" aria-label="删除">×</button></span></div>`).join('') : '<div class="hint">点上面句子里的任何一个词，就能加进来。</div>';
    body=`<div class="eyebrow">03 吃透</div><h2>每个单词、每个句型都弄明白</h2>
      <p class="small muted" style="margin:6px 0 12px">这一步她的要求是「把每个单词、每个句型吃透」。点任何一个词进生词本，句子下面写它的句型和语法。全部勾完才开始背。</p>
      <div>${items}</div>
      <div class="card" style="margin-top:14px;box-shadow:none"><div class="row" style="justify-content:space-between"><h2 style="font-size:15px">生词本 <span class="num muted">${m.vocab.length}</span></h2><span class="hint">听写漏掉的词已自动放进来</span></div><div class="vocab" style="margin-top:10px">${vocab}</div></div>
      <button class="btn primary block" id="toRecite" style="margin-top:14px" ${allOk?'':'disabled'}>${allOk?'全部吃透，开始背':`还有 ${total-okN} 句没勾`}</button>`;
  } else {
    const paras=[]; for(let p=0;p<st.paraCount;p++){ paras.push(st.sents.map((s,i)=>st.paraOf[i]===p?s:null).filter(Boolean)); }

    const cards=paras.map((ss,p)=>{ const mode=(sub.mode||{})[p]||'full'; const txt=ss.join(' '); const shown= mode==='full'?esc(txt): mode==='first'? esc(firstLetters(txt)) : `<span class="muted">（${ss.length} 句 · ${wordCount(txt)} 词）</span>`;
      return `<div class="recite-p ${m.recited[p]?'ok':''}"><div class="row" style="justify-content:space-between"><span class="para-h" style="margin:0">意群 ${p+1}</span><span class="row" style="gap:4px"><button class="btn sm ${mode==='full'?'on':''}" data-mode="full" data-p="${p}">全文</button><button class="btn sm ${mode==='first'?'on':''}" data-mode="first" data-p="${p}">首字母</button><button class="btn sm ${mode==='hide'?'on':''}" data-mode="hide" data-p="${p}">全隐</button></span></div>
        <div class="txt">${shown}</div><label class="row small"><input type="checkbox" data-rp="${p}" ${m.recited[p]?'checked':''}> 这段全隐也能脱稿背出</label></div>`; }).join('');
    body=`<div class="eyebrow">03 背诵</div><h2>一组一组意群去背，背到脱稿</h2>
      <p class="small muted" style="margin:6px 0 12px">先看全文背，再只留首字母，最后全隐。每段全隐都能背出来再打勾。音频留着，想听哪段用 A、B 圈起来听。</p>
      ${playerHTML({segment:true})}
      <div class="stack">${cards}</div>
      <button class="btn primary block" id="toSpeed" style="margin-top:14px" ${allP?'':'disabled'}>${allP?'全篇能脱稿，去练原速':`还有 ${paras.length-okP} 段没脱稿`}</button>`;
  }
  return `<div class="card">${tabs}${body}</div>`;
}
function bindDigest(m){
  const sub=S.sub[m.id]; const st=buildStructure(m.transcript);
  document.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>{ if(b.disabled) return; sub.phase=b.dataset.ph; render(); });

    document.querySelectorAll('[data-vm]').forEach(i=>{ let k; i.addEventListener('input',()=>{ clearTimeout(k); k=setTimeout(()=>{ m.vocab[+i.dataset.vm].meaning=i.value; Store.saveMaterial(m); },600); }); });

    const ts=$('#toSpeed'); ts.onclick=()=>{ m.step=4; S.sub[m.id]={step:4}; Store.saveMaterial(m,true); toast('最后一步：背到和音频一样快。'); render(); };

/* ---------- 第四步：原速 ---------- */
const SW={running:false,start:0,raf:0,peeked:false};
function stepSpeed(m){
  const sub=S.sub[m.id]; const dur=m.durationSec; const lo=Math.round(dur*0.85), hi=Math.round(dur*1.15);
  const att=m.speed.attempts.slice().reverse().map(a=>{ const d=(a.sec-dur)/dur; const cls=a.valid===false?'lock':Math.abs(d)<=0.15?'ok':'warn'; return `<div class="attempt"><span class="num">${fmtTime(a.sec)}</span><span class="small muted">${new Date(a.at).toLocaleDateString('zh-CN')} · ${a.valid===false?'看了原文，不算':(d>0?'慢':'快')+Math.abs(d*100).toFixed(0)+'%'}</span><span class="chip ${cls}">${a.valid===false?'无效':Math.abs(d)<=0.15?'达标':'未达标'}</span></div>`; }).join('');
  const passed=m.speed.attempts.some(a=>a.valid!==false&&Math.abs(a.sec-dur)/dur<=0.15);
  const showText=!!sub.showText;
  return `<div class="card"><div class="eyebrow">04 原速</div><h2>背到和音频一样快，脱口而出</h2>
    <p class="small muted" style="margin:6px 0 12px">她的最后一关：背诵语速和原音频一致。原文默认藏起来，按下开始，整篇背完按停，看用时和音频差多少。差 15% 以内算达标。中途看原文，这一次就不算。</p>
    <div class="row" style="justify-content:space-around;text-align:center;margin:8px 0 14px"><div><div class="eyebrow">音频时长</div><div class="big">${fmtTime(dur)}</div><div class="hint num">达标区间 ${fmtTime(lo)}–${fmtTime(hi)}</div></div><div><div class="eyebrow">本次用时</div><div class="big" id="swTime">0:00</div><div class="hint" id="swHint">&nbsp;</div></div></div>
    <div class="row"><button class="btn primary grow" id="swBtn">开始背</button><button class="btn" id="peekBtn">${showText?'藏起原文':'看一眼原文'}</button></div>
    ${showText?`<div class="diff card" style="box-shadow:none;margin-top:12px">${esc(m.transcript).replace(/\n/g,'<br>')}</div>`:''}
    <details style="margin-top:14px"><summary>跟着音频一起背（影子跟读）</summary><div style="margin-top:8px">${playerHTML({segment:true,speed:true})}</div></details>
    <div style="margin-top:14px"><div class="eyebrow">记录</div>${att||'<div class="hint">还没有记录。</div>'}</div>
    ${passed&&m.status!=='done'?`<div class="note ok" style="margin-top:14px">已经有一次在原速区间内。这篇可以收了。</div><button class="btn primary block" id="finishBtn" style="margin-top:10px">这篇完成，收进书架</button>`:''}
    ${m.status==='done'?`<div class="note ok" style="margin-top:14px">完成于 ${new Date(m.completedAt).toLocaleDateString('zh-CN')}。用了 ${daysBetween(m.startedAt,m.completedAt)+1} 天。</div>`:''}
  </div>`;
}
function bindSpeed(m){
  const sub=S.sub[m.id]; loadAudio(m).then(()=>bindPlayer($('#matView'))); P.onEnded=null;
  const btn=$('#swBtn'), tm=$('#swTime'), hint=$('#swHint');
  const tick=()=>{ if(!SW.running) return; tm.textContent=fmtTime((Date.now()-SW.start)/1000); SW.raf=requestAnimationFrame(tick); };
  btn.onclick=()=>{ if(!SW.running){ SW.running=true; SW.start=Date.now(); SW.peeked=!!sub.showText; btn.textContent='背完了，停'; btn.classList.add('danger'); hint.textContent='计时中…'; tick(); }
    else { SW.running=false; cancelAnimationFrame(SW.raf); const sec=Math.round((Date.now()-SW.start)/1000); if(sec<10){ toast('太短了，这次不记'); btn.textContent='开始背'; btn.classList.remove('danger'); hint.innerHTML='&nbsp;'; return; }
      m.speed.attempts.push({sec,at:Date.now(),valid:!SW.peeked}); Store.saveMaterial(m,true); const d=(sec-m.durationSec)/m.durationSec; toast(SW.peeked?'记下了，但看了原文，不算达标':(Math.abs(d)<=0.15?'在原速区间内！':(d>0?'比原音频慢 ':'比原音频快 ')+Math.abs(d*100).toFixed(0)+'%')); render(); } };
  $('#peekBtn').onclick=()=>{ sub.showText=!sub.showText; if(sub.showText&&SW.running) SW.peeked=true; render(); if(SW.running){ /* 保持计时显示 */ const t=$('#swTime'); const b=$('#swBtn'); b.textContent='背完了，停'; b.classList.add('danger'); const h=$('#swHint'); h.textContent='计时中…（已看原文，本次不算）'; const tk=()=>{ if(!SW.running) return; t.textContent=fmtTime((Date.now()-SW.start)/1000); SW.raf=requestAnimationFrame(tk); }; tk(); bindSpeedAfterRender(m); } };
  const f=$('#finishBtn'); if(f) f.onclick=()=>{ m.status='done'; m.completedAt=Date.now(); Store.saveMaterial(m,true); toast('第 '+(orderedMaterials().indexOf(m)+1)+' 篇，啃完了。'); S.view='home'; render(); };
}
function bindSpeedAfterRender(m){ /* render() 已重绑；此处仅为语义占位 */ }
function bindStep(m,step){ $('#wordPop').hidden=true; if(step===1) bindSelect(m); else if(step===2) bindDictation(m); else if(step===3) bindDigest(m); else bindSpeed(m); }

/* ============ 启动 ============ */
(async function boot(){
  const local=Store.localAll(); if(local.profile) S.profile=Object.assign({dayLog:{},order:[]},local.profile); S.materials=local.materials||{};
  const le=Store.lsGet('kl:errors'); if(le&&le.items) S.errors=le;
  if(S.ui.view==='mat'&&S.ui.curId&&S.materials[S.ui.curId]){ S.view='mat'; S.curId=S.ui.curId; S.sub=S.ui.sub||{}; }
  render();
  await Store.init();
  const remote=await Store.pullAll();
  if(remote){
    let changed=false;
    if(remote.profile&&(remote.profile.updatedAt||0)>(S.profile.updatedAt||0)){ S.profile=Object.assign({dayLog:{},order:[]},remote.profile); changed=true; }
    if(remote.errors&&remote.errors.items&&(remote.errors.updatedAt||0)>(S.errors.updatedAt||0)){ S.errors=remote.errors; Store.lsSet('kl:errors',S.errors); changed=true; }
    else if(Object.keys(S.errors.items).length&&!remote.errors) Store.saveErrors(S.errors);
    for(const [id,rm] of Object.entries(remote.materials)){ const lm=S.materials[id]; if(!lm||(rm.updatedAt||0)>(lm.updatedAt||0)){ S.materials[id]=rm; Store.lsSet('kl:m:'+id,rm); changed=true; } }
    // 本地有而云端没有的，推上去
    for(const m of Object.values(S.materials)){ if(!remote.materials[m.id]) Store.saveMaterial(m,true); }
    if(changed||!document.activeElement||document.activeElement.tagName==='BODY') render(); else { /* 正在输入，不打断 */ }
  } else { const chip=document.querySelector('#homeView .chip.warn, #homeView .chip.ok'); if(chip&&S.view==='home') render(); }
})();
</script>

<script>
// 离线缓存
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); }); }
// 装到桌面的提示（已经装好的不显示）
(function(){
  const standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (standalone || window.Capacitor) return;
  try { if (localStorage.getItem('kl:installTipHidden')) return; } catch (e) {}
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const b = document.createElement('div'); b.className = 'install-tip';
  b.innerHTML = '<span>' + (isIOS
    ? '装到桌面：在 Safari 里点底部「分享」，选「添加到主屏幕」。以后从桌面图标打开，不用登录，断网也能用；装好后数据才会长期保留。'
    : '装到桌面：浏览器菜单里选「添加到主屏幕」或「安装应用」，以后像 App 一样打开。') + '</span><button type="button">知道了</button>';
  document.body.appendChild(b);
  b.querySelector('button').onclick = () => { b.remove(); try { localStorage.setItem('kl:installTipHidden', '1'); } catch (e) {} };
})();
</script>
